services:

  postgres:
      image: postgres:16-alpine
      container_name: postgres_db
      environment:
        POSTGRES_DB: doodleDB
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: manishnewpassword
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d doodleDB"]
        interval: 5s
        timeout: 5s
        retries: 5

  app:
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/doodleDB
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEF_PSW: ${DEF_PSW}
      SIGNING_KEY: ${SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
